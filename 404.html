<style>
/* =========================================================
   PÁGINA 404
   ========================================================= */
.not-found-page{
    position:relative;
    min-height:100vh;
    margin-left:220px;
    display:grid;
    place-items:center;
    padding:64px 40px;
    overflow:hidden;
    background:
        radial-gradient(circle at 75% 22%, rgba(255,61,166,.18), transparent 28%),
        radial-gradient(circle at 22% 78%, rgba(255,122,61,.15), transparent 26%),
        #050510;
}

.not-found-page::before,
.not-found-page::after{
    content:"";
    position:absolute;
    border:1px solid rgba(255,255,255,.09);
    border-radius:50%;
    pointer-events:none;
}

.not-found-page::before{
    width:min(72vw, 880px);
    aspect-ratio:1;
    top:-42%;
    right:-18%;
}

.not-found-page::after{
    width:min(42vw, 500px);
    aspect-ratio:1;
    bottom:-26%;
    left:-12%;
}

.not-found-card{
    position:relative;
    z-index:1;
    width:min(100%, 690px);
    padding:clamp(38px, 7vw, 76px);
    text-align:center;
    backdrop-filter:blur(10px);
}

.not-found-code{
    display:block;
    margin-bottom:14px;
    font-family:'Archivo Black', Arial, sans-serif;
    font-size:clamp(5rem, 17vw, 10rem);
    line-height:.85;
    letter-spacing:-.08em;
    color:transparent;
    background:linear-gradient(110deg, #ff3da6, #ff7a3d);
    -webkit-background-clip:text;
    background-clip:text;
}

.not-found-card h1{
    font-family:'Archivo Black', Arial, sans-serif;
    font-size:clamp(1.55rem, 4vw, 2.35rem);
    line-height:1.1;
    text-transform:uppercase;
}

.not-found-card p{
    max-width:48ch;
    margin:18px auto 30px;
    color:rgba(255,255,255,.72);
    font-size:1rem;
    line-height:1.7;
}

.not-found-home{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:48px;
    padding:0 24px;
    border-radius:999px;
    color:#fff;
    font-size:.84rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    background:linear-gradient(110deg, #ff3da6, #ff7a3d);
    transition:transform .2s ease, box-shadow .2s ease;
}

.not-found-home:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 26px rgba(255,93,143,.28);
}

.not-found-home:focus-visible{
    outline:2px solid #fff;
    outline-offset:4px;
}

@media(max-width:768px){
    .not-found-page{
        min-height:calc(100vh - 70px);
        margin-left:0;
        padding:32px 20px;
    }
}

</style>
